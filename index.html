function sendCalcRequest() {
    let total = 0;
    let itemsText = "";
    for(let i in customerOrder) {
        const s = masterProfile.services[i];
        const lineTotal = s.price * customerOrder[i];
        total += lineTotal;
        itemsText += `\n- ${s.name}: ${customerOrder[i]} ${s.unit} (${formatNum(lineTotal)} ₸)`;
    }
    if(total === 0) return showToast("Выберите услуги!");

    // Вместо прямой отправки теперь открываем окно подтверждения сделки
    openDealModal(total, itemsText);
}

function openDealModal(total, itemsText) {
    // Создаем или показываем модальное окно сделки
    const modalHtml = `
        <div id="deal-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] flex items-end">
            <div class="bg-white w-full rounded-t-3xl p-6 animate-in">
                <h2 class="text-xl font-bold mb-4">Оформление сделки</h2>
                <div class="space-y-4">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">Сумма работ:</span>
                        <span class="font-bold">${formatNum(total)} ₸</span>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400">Предоплата (если есть)</label>
                        <input type="number" id="prepayment-amount" placeholder="0" class="w-full p-4 bg-gray-50 rounded-2xl ring-1 ring-gray-200 outline-none mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400">Способ оплаты</label>
                        <select id="pay-method" class="w-full p-4 bg-gray-50 rounded-2xl ring-1 ring-gray-200 outline-none mt-1">
                            <option value="Наличные">Наличные</option>
                            <option value="Перевод">Перевод (Kaspi/Банк)</option>
                        </select>
                    </div>
                    <button onclick="confirmDeal('${total}', \`${itemsText}\`)" class="w-full bg-green-500 text-white font-black py-5 rounded-2xl shadow-xl uppercase tracking-widest text-sm">
                        Ударить по рукам
                    </button>
                    <button onclick="document.getElementById('deal-modal').remove()" class="w-full text-gray-400 py-2 text-sm">Отмена</button>
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', modalHtml);
}

function confirmDeal(total, itemsText) {
    const prepayment = document.getElementById('prepayment-amount').value || 0;
    const method = document.getElementById('pay-method').value;
    const rest = total - prepayment;

    const date = new Date().toLocaleDateString();
    
    // Формируем "Договор-сообщение"
    const contract = `🤝 СДЕЛКА ПОДТВЕРЖДЕНА (${date})\n` +
                     `--------------------------\n` +
                     `Мастер: ${masterProfile.name}\n` +
                     `Услуги:${itemsText}\n` +
                     `--------------------------\n` +
                     `💰 ИТОГО: ${formatNum(total)} ₸\n` +
                     `✅ Внесено: ${formatNum(prepayment)} ₸ (${method})\n` +
                     `⏳ ОСТАТОК: ${formatNum(rest)} ₸\n\n` +
                     `Данное сообщение является подтверждением начала работ и получения средств.`;

    const cleanPhone = masterProfile.phone.replace(/\D/g, '');
    window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(contract)}`, '_blank');
    
    document.getElementById('deal-modal').remove();
    showToast("✅ Сделка зафиксирована!");
    showScreen('screen-vizitka');
    
    // В будущем здесь добавим сохранение в "Мои заказы"
}
