<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДЕЛО — Настройка профиля</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div id="app" class="max-w-md mx-auto min-h-screen p-4">
        
        <div id="screen-setup" class="bg-white rounded-3xl shadow-xl p-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Настройка профиля</h1>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Как вас зовут (или название компании)</label>
                    <input type="text" id="master-name" placeholder="Иван Иванов / ИП 'Мастер'" class="w-full p-4 bg-gray-50 rounded-2xl border-none ring-1 ring-gray-200">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Страна</label>
                    <select id="master-country" onchange="updateRegions()" class="w-full p-4 bg-gray-50 rounded-2xl border-none ring-1 ring-gray-200">
                        <option value="">Выберите страну</option>
                        <option value="KZ">Казахстан</option>
                        <option value="RU">Россия</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Город / Регион</label>
                    <select id="master-city" class="w-full p-4 bg-gray-50 rounded-2xl border-none ring-1 ring-gray-200">
                        <option value="">Сначала выберите страну</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Специализация</label>
                    <select id="master-spec" class="w-full p-4 bg-gray-50 rounded-2xl border-none ring-1 ring-gray-200">
                        <option value="">Выберите сферу</option>
                        <option value="mebel">Ремонт мебели</option>
                        <option value="stroy">Строительные работы</option>
                        <option value="electro">Электрика</option>
                        <option value="plumb">Сантехника</option>
                        <option value="clean">Клининг</option>
                    </select>
                </div>

                <button onclick="saveProfile()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg mt-4">СОХРАНИТЬ И СОЗДАТЬ ВИЗИТКУ</button>
            </div>
        </div>

        <div id="screen-vizitka" class="hidden bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
            <div class="h-32 bg-gradient-to-r from-blue-600 to-indigo-700 p-6 flex justify-end">
                <button onclick="showScreen('screen-setup')" class="text-white opacity-50">⚙️</button>
            </div>
            <div class="px-6 pb-6 -mt-12 text-center">
                <div class="inline-block w-24 h-24 bg-white p-1 rounded-full shadow-lg">
                    <div id="display-photo" class="w-full h-full bg-gray-200 rounded-full flex items-center justify-center text-gray-400 font-bold uppercase text-xs">Фото</div>
                </div>
                <h1 id="display-name" class="mt-4 text-2xl font-bold text-gray-800">Загрузка...</h1>
                <p id="display-spec" class="text-blue-600 font-medium">Специализация</p>
                <p id="display-location" class="text-gray-400 text-sm mt-1">📍 Город</p>

                <button onclick="showScreen('screen-request')" class="mt-8 w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-blue-200 shadow-lg uppercase tracking-wide">Заказать расчет сметы</button>
            </div>
        </div>

        </div>

    <script>
        // База данных городов (упрощенная для примера, расширим по твоему запросу)
        const geoData = {
            "KZ": ["Астана", "Алматы", "Павлодар", "Шымкент", "Караганда", "Актобе"],
            "RU": ["Москва", "Санкт-Петербург", "Новосибирск", "Екатеринбург"]
        };

        function updateRegions() {
            const country = document.getElementById('master-country').value;
            const citySelect = document.getElementById('master-city');
            citySelect.innerHTML = '<option value="">Выберите город</option>';
            
            if (geoData[country]) {
                geoData[country].forEach(city => {
                    let opt = document.createElement('option');
                    opt.value = city;
                    opt.innerHTML = city;
                    citySelect.appendChild(opt);
                });
            }
        }

        function saveProfile() {
            const profile = {
                name: document.getElementById('master-name').value,
                country: document.getElementById('master-country').value,
                city: document.getElementById('master-city').value,
                spec: document.getElementById('master-spec').options[document.getElementById('master-spec').selectedIndex].text
            };

            if(!profile.name || !profile.city) {
                alert("Пожалуйста, заполните все поля!");
                return;
            }

            // Сохраняем в память телефона
            localStorage.setItem('masterProfile', JSON.stringify(profile));
            loadProfile();
        }

        function loadProfile() {
            const data = localStorage.getItem('masterProfile');
            if (data) {
                const profile = JSON.parse(data);
                document.getElementById('display-name').innerText = profile.name;
                document.getElementById('display-spec').innerText = profile.spec;
                document.getElementById('display-location').innerText = `📍 ${profile.city}`;
                showScreen('screen-vizitka');
            } else {
                showScreen('screen-setup');
            }
        }

        function showScreen(id) {
            document.querySelectorAll('#app > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // Запуск при загрузке
        loadProfile();
    </script>
</body>
</html>
